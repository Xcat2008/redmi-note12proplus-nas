name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Installer offline checks
        run: python3 -m unittest discover -s image -v
      - name: Shell syntax
        run: find scripts homeio/installer -name '*.sh' -print0 | xargs -0 -n1 bash -n
