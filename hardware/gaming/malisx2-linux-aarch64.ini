[binaries]
c = 'aarch64-linux-gnu-gcc-12'
cpp = 'aarch64-linux-gnu-g++-12'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
rust = ['rustc', '--target', 'aarch64-unknown-linux-gnu', '-C', 'linker=aarch64-linux-gnu-gcc-12']
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = true
sys_root = '/opt/redmi-native-build/native-driver-sysroot'
pkg_config_libdir = ['/opt/redmi-native-build/native-driver-sysroot/usr/lib/aarch64-linux-gnu/pkgconfig', '/opt/redmi-native-build/native-driver-sysroot/usr/share/pkgconfig']
bindgen_clang_arguments = ['-I/usr/aarch64-linux-gnu/include']

[built-in options]
c_args = ['-mcpu=cortex-a55']
cpp_args = ['-mcpu=cortex-a55']
c_link_args = ['-L/opt/redmi-native-build/native-driver-sysroot/usr/lib/aarch64-linux-gnu', '-Wl,--allow-shlib-undefined']
cpp_link_args = ['-L/opt/redmi-native-build/native-driver-sysroot/usr/lib/aarch64-linux-gnu', '-Wl,--allow-shlib-undefined']

[host_machine]
system = 'linux'
kernel = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a55'
endian = 'little'
