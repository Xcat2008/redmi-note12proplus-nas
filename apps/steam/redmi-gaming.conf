server {
 listen 3443 ssl;
 listen [::]:3443 ssl;
 server_name _;
 error_page 497 =302 https://$host:3443$request_uri;
 ssl_certificate /etc/nginx/redmi-retroarch/server.crt;
 ssl_certificate_key /etc/nginx/redmi-retroarch/server.key;
 server_tokens off;
 client_max_body_size 1G;
 location = /__homeio_auth {
  internal;
  proxy_pass http://127.0.0.1:12026/api/auth/me;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Host $host;
 }
 location = /nas-session-branding.js {
  alias /usr/local/share/redmi-nas/gaming/nas-session-branding.js;
  default_type application/javascript;
  add_header Cache-Control "no-store";
 }
 location = /nas-steam-icon.png { alias /opt/home-server/public/steam-icon.png; }
 location = /nas-retroarch-icon.svg { alias /opt/home-server/public/retroarch-icon.svg; }
 location / {
  auth_request /__homeio_auth;
  error_page 401 = @login;
  proxy_pass http://127.0.0.1:3300;
  proxy_ssl_verify off;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header Cookie "";
  proxy_set_header Accept-Encoding "";
  sub_filter '<title>Selkies</title>' '<title>NAS · Sessão de jogos</title>';
  sub_filter '</head>' '<script src="/nas-session-branding.js" defer></script></head>';
  sub_filter_once on;
  add_header Cache-Control "no-store";
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
 }
 location @login {
  default_type text/html;
  return 401 '<!doctype html><html lang="pt"><meta charset="utf-8"><title>NAS · Sessão de jogos</title><body><h1>NAS · Sessão de jogos</h1><p>Inicia sess&atilde;o no Homeio para abrir esta aplica&ccedil;&atilde;o.</p></body></html>';
 }
}
