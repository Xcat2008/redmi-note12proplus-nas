<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Abrir aplicação · Homeio</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101827;color:#edf2fa}
    body{margin:0;min-height:100vh;display:grid;place-items:center}
    main{margin:24px;padding:32px;max-width:440px;background:#19253a;border:1px solid #33435c;border-radius:20px}
    small{color:#9db4d5}h1{font-size:26px}p{line-height:1.6;color:#c4d2e5}
    button,a{display:inline-block;border:0;border-radius:9px;background:#3874ce;color:white;padding:12px 18px;font:inherit;cursor:pointer;text-decoration:none;margin:8px 8px 0 0}
    a{background:#263b59}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}
    #status{min-height:76px}#error{color:#ffbfad}
  </style>
</head>
<body><main>
  <small>HOMEIO · SESSÃO DE JOGOS</small>
  <h1 id="title">A preparar a aplicação…</h1>
  <p id="status" role="status" aria-live="polite">A aguardar o arranque. Esta página abre a sessão assim que estiver pronta.</p>
  <p id="error" role="alert" hidden></p>
  <button id="start" hidden>Iniciar e abrir</button>
  <a id="stream" hidden>Abrir sessão diretamente</a>
  <p><small>A aplicação corre na NAS. Podes continuar a usar o Homeio noutro separador.</small></p>
</main><script type="module" src="/gaming-launcher.js"></script></body>
</html>
