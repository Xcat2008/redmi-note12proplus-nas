# Native Redmi NAS defaults. Copied once; subsequent user changes are retained.
video_driver = "gl"
video_context_driver = "wayland"
video_fullscreen = "true"
video_vsync = "true"
audio_driver = "pulse"
input_driver = "udev"
input_joypad_driver = "udev"
menu_driver = "ozone"
assets_directory = "/usr/share/libretro/assets"
libretro_directory = "~/.local/share/retroarch/cores"
libretro_info_path = "~/.local/share/retroarch/info"
joypad_autoconfig_dir = "~/.local/share/retroarch/autoconfig"
rgui_browser_directory = "/DATA/Games/ROMs"
system_directory = "/DATA/Games/BIOS"
savefile_directory = "/DATA/Games/Saves"
savestate_directory = "/DATA/Games/States"
screenshot_directory = "/DATA/Games/Screenshots"
playlist_directory = "~/.local/share/retroarch/playlists"
config_save_on_exit = "true"
menu_show_core_updater = "true"
pause_nonactive = "false"
network_cmd_enable = "false"
stdin_cmd_enable = "false"
gamemode_enable = "false"
