video_driver = "gl"
video_context_driver = "egl_x"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_refresh_rate = "60"
video_swap_interval = "1"
input_driver = "x"
input_joypad_driver = "udev"
audio_driver = "pulse"
menu_driver = "ozone"
menu_mouse_enable = "true"
menu_throttle_framerate = "true"
menu_timedate_enable = "false"
assets_directory = "/usr/share/libretro/assets"
libretro_directory = "/home/nas/.local/share/retroarch/cores"
libretro_info_path = "/home/nas/.local/share/retroarch/info"
joypad_autoconfig_dir = "/home/nas/.local/share/retroarch/autoconfig"
rgui_browser_directory = "/DATA/Games/ROMs"
system_directory = "/DATA/Games/BIOS"
savefile_directory = "/DATA/Games/Saves"
savestate_directory = "/DATA/Games/States"
screenshot_directory = "/DATA/Games/Screenshots"
playlist_directory = "/DATA/AppData/custom-retroarch/native/playlists"
config_save_on_exit = "true"
menu_show_core_updater = "true"
pause_nonactive = "false"
suspend_screensaver_enable = "false"
microphone_enable = "false"
gamemode_enable = "false"
